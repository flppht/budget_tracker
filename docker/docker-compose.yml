version: "3.8"

networks:
  budgettracker-network:
    driver: bridge
    external: true

volumes:
  budgettracker-data:
    name: budgettracker-data

services:
  postgres:
    image: postgres:14-alpine
    container_name: postgres-container
    ports:
      - "5432:5432"
    networks:
      - budgettracker-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
  
  nodejs:
    image: node:latest
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: nodejs-container
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3001:3001"
    networks:
      - budgettracker-network
    depends_on:
      - postgres
  
  reactjs:
    image: node-20:alpine
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: reactjs-container
    ports:
      - '3000:3000'
    networks:
      - budgettracker-network
    depends_on:
      - nodejs
      - postgres
    restart: always